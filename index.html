<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxora Watch</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 7%;
      background: #111;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hero h1 {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #ccc;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 30px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .products {
      padding: 60px 7%;
    }

    .products h2 {
      text-align: center;
      margin-bottom: 35px;
      font-size: 35px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .card {
      background: #151515;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #292929;
    }

    .watch {
      height: 220px;
      background: #222;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
      margin-bottom: 20px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .price {
      color: #ddd;
      margin-bottom: 15px;
    }

    footer {
      text-align: center;
      padding: 35px;
      background: #111;
      margin-top: 40px;
      color: #aaa;
    }
