<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luxora Watch</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#080808;
  color:white;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#0d0d0d;
  border-bottom:1px solid #292929;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:bold;
  letter-spacing:3px;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:18px;
  font-size:14px;
}

.hero{
  min-height:75vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:50px 20px;
  background:
    radial-gradient(circle at center,#292929 0%,#080808 55%);
}

.hero h1{
  font-size:55px;
  letter-spacing:6px;
  margin-bottom:18px;
}

.hero p{
  color:#bbb;
  font-size:18px;
  margin-bottom:30px;
}

.button{
  display:inline-block;
  background:white;
  color:black;
  padding:14px 28px;
  border-radius:4px;
  text-decoration:none;
  font-weight:bold;
}

.section{
  padding:70px 6%;
}

.section-title{
  text-align:center;
  font-size:35px;
  margin-bottom:40px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}

.card{
  background:#141414;
  border:1px solid #292929;
  border-radius:10px;
  padding:18px;
  text-align:center;
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.watch-box{
  height:260px;
  border-radius:8px;
  background:linear-gradient(145deg,#333,#111);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:90px;
  margin-bottom:20px;
}

.card h3{
  font-size:21px;
  margin-bottom:10px;
}

.price{
  color:#ccc;
  font-size:18px;
  margin-bottom:18px;
}

.contact{
  text-align:center;
  background:#111;
}

.contact p{
  color:#bbb;
  margin-bottom:25px;
}

.social{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}

.social a{
  text-decoration:none;
  padding:13px 22px;
  border-radius:5px;
  background:white;
  color:black;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
